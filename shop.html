<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bon Prix Suiv | المتجر الإلكتروني الرسمي</title>
  <link rel="icon" type="image/jpeg" href="./assets/logo.jpg">
  <link rel="apple-touch-icon" href="./assets/logo.jpg">
  <meta name="theme-color" content="#dc2626">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Tajawal', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

  <div id="shop-root" class="min-h-screen flex flex-col">
    <div class="flex-1 flex flex-col items-center justify-center p-8 text-center space-y-3">
      <div class="w-12 h-12 border-4 border-red-200 border-t-red-600 rounded-full animate-spin"></div>
      <p class="text-sm font-bold text-slate-600">جاري تحميل منتجات المتجر...</p>
    </div>
  </div>

  <div id="shop-modal"></div>
  <div id="shop-toast" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2"></div>

  <script src="./js/data.js"></script>
  <script src="./js/shop.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGYWNwsxjzyWzCYeMJD0BLoa4a7D3Vgkk",
      authDomain: "bon-prix-suiv.firebaseapp.com",
      projectId: "bon-prix-suiv",
      storageBucket: "bon-prix-suiv.appspot.com",
      messagingSenderId: "867391994300",
      appId: "1:867391994300:web:6656e418d18c83d816d3b9",
      measurementId: "G-17RSY8IF3H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.shopFb = { db, doc, getDoc, setDoc, collection, getDocs, onSnapshot };

    if (window.initPublicShop) {
      window.initPublicShop();
    }
  </script>
</body>
</html>
